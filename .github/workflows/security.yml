name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1' # Weekly on Mondays at 06:00 UTC

permissions:
  contents: read
  security-events: write

jobs:
  codeql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: typescript

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      # The pull_request trigger catches an advisory a PR introduces. The
      # schedule is what catches an advisory published against dependencies
      # that never changed, which is how 13 of them accumulated here unseen.
      #
      # This also guards the two `brace-expansion@<range>` and two
      # `js-yaml@<range>` resolutions in package.json. Yarn's ranged
      # resolutions only bind while the descriptor still matches, and when
      # they stop matching they are ignored silently: install still exits 0.
      # Without this job, a dropped pin looks exactly like a passing build.
      #
      # There are no ignores. The previous `--ignore 1124334`
      # (GHSA-mh99-v99m-4gvg, the brace-expansion unbounded-expansion OOM)
      # was retired 2026-08-11 because its premise expired: it was added
      # when that advisory had no patched release on any major, and 1.1.17
      # has since shipped for the 1.x line. The resolutions now clear it by
      # version instead of by exception, so the "waits on upstream" note
      # about fork-ts-checker-webpack-plugin no longer applies.
      #
      # That ignore was deliberately pinned to an advisory ID rather than a
      # package glob, and this comment predicted that a NEW brace-expansion
      # advisory would carry a new ID and still fail the job. That is what
      # happened: GHSA-rgw5-rvv9-x895 landed, explicitly bypassing the
      # CVE-2026-14257 mitigation, range >=4.0.0 <5.0.9, against a 5.x tree
      # pinned to 5.0.8. One patch short. An ID-scoped ignore is why it
      # surfaced rather than being swallowed. Keep future ignores ID-scoped.
      - name: Audit for high/critical vulnerabilities
        run: yarn npm audit --all --recursive --severity high

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build vault-api Docker image
        run: docker build -t vault-api:scan -f apps/vault-api/Dockerfile .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: vault-api:scan
          format: table
          exit-code: 1
          severity: CRITICAL
